# 跟随上游 ximeiorg/Xime 自动构建「键盘底部贴底」补丁版 APK
#
# ── 产物 ───────────────────────────────────────────────────────────────
# 默认构建 **release**（R8 精简 + 资源压缩），且只打包 **arm64-v8a**，用**固定密钥**签名：
#   · release   -> Release 标签 `patched-apk`        （永久链接，可覆盖安装升级）
#   · debug     -> Release 标签 `patched-apk-debug`  （手动触发时的备用路径）
# 只取 arm64-v8a 一个架构：现代手机都是它，能省掉另外 3 份 native 库（约 35 MB×3）。
# ⚠ 曾经踩过的坑：以前用 `find ... | head -1` 随手取一个 APK，结果发布出去的是 **x86_64**
#   那一份（真机装上去加载不到 librime 会崩）。现在改成按 TARGET_ABI 明确挑选，
#   并在发布前**核对 APK 内的 native 架构**，不符就红。
#
# ── 补丁是怎么"动态"适配上游的 ──────────────────────────────────────────
# 不再用逐行精确匹配的 git apply（上游一改邻近代码就套不上），改成三方合并：
#     current = 上游最新文件（本次检出）
#     base    = patch-base/<文件> 里保存的「改动前的原版文件」
#     other   = 把 xime-flush-bottom.patch 作用在 base 上还原出的「我们改完的版本」
#   git merge-file 会把「我们相对 base 的那点改动」搬到上游最新代码上：
#   上游在别处、甚至就在我们改的那几行上下动刀都不影响；
#   只有真正改了同一行（语义冲突）才会冲突 —— 那时报错 + 打印冲突片段 + 构建失败，绝不静默出错。
#
# ── 其他要点 ──────────────────────────────────────────────────────────
#  - 不向 fork 推代码。签名密钥从本仓库 Secrets 注入（SIGNING_KEY / KEY_STORE_PASSWORD /
#    ALIAS / KEY_PASSWORD），只在 runner 上落地成 app/keystore.properties，不提交。
#  - 上游 nightly.yml / release.yml 依赖 secrets.SIGNING_KEY 等签名密钥，fork 里没有；
#    GitHub 已自动把它们标成 disabled_fork，不要手动启用。
#  - ⚠ 本工作流的构建步骤是上游 build.yml / release.yml 的副本（已做 ABI 收敛）。
#    上游若改了构建方式（NDK 版本、依赖下载等），这里需要同步跟进，否则会构建失败（会变红，不会静默）。
#  - 构建并发布成功后，若仓库配置了 MAIL_* 系列 Secrets（MAIL_TO / MAIL_FROM / MAIL_SMTP_SERVER /
#    MAIL_SMTP_PORT / MAIL_USERNAME / MAIL_PASSWORD），会通过 dawidd6/action-send-mail 发一封
#    邮件通知（收件人、SMTP 等都只存在 Secrets 里；没配置就自动跳过，不影响任何构建步骤）。
name: Build patched APK (follow upstream)

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '即使上游没有新提交也强制重新构建（同时跑一遍三方合并自检）'
        required: false
        type: boolean
        default: false
      variant:
        description: '构建类型：release = 签名精简版（推荐）；debug = 调试版'
        required: false
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: write

concurrency:
  group: build-patched-apk
  cancel-in-progress: false

env:
  # 只打这一种架构。想改回通用包就把下面改成 universal 之外的策略并调整选取逻辑。
  TARGET_ABI: arm64-v8a

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      sha: ${{ steps.decide.outputs.sha }}
      variant: ${{ steps.decide.outputs.variant }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: 比对上游最新提交与上次构建
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VARIANT="${{ github.event.inputs.variant }}"
          [ -n "$VARIANT" ] || VARIANT=release
          if [ "$VARIANT" = "debug" ]; then TAG=patched-apk-debug; else TAG=patched-apk; fi
          echo "构建类型 = $VARIANT ；Release 标签 = $TAG"
          SHA=$(git ls-remote https://github.com/ximeiorg/Xime.git refs/heads/main | cut -f1)
          echo "上游 ximeiorg/Xime@main = $SHA"
          LAST=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null | grep -o 'upstream-sha: [0-9a-f]\{40\}' | head -1 | cut -d' ' -f2 || true)
          echo "上次成功构建于 = ${LAST:-<无记录>}"
          {
            echo "sha=$SHA"
            echo "variant=$VARIANT"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "手动强制构建"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$SHA" = "$LAST" ]; then
            echo "上游无新提交，跳过构建"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "上游有更新，开始构建"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.publish.outputs.url }}
      sha: ${{ steps.publish.outputs.sha }}
      sha256: ${{ steps.publish.outputs.sha256 }}
      size: ${{ steps.publish.outputs.size }}
      variant: ${{ steps.publish.outputs.variant }}
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: 检出上游最新源码
        uses: actions/checkout@v7
        with:
          repository: ximeiorg/Xime
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: 取回补丁与基准文件（它们在本 fork 的 main 上，不在上游代码树里）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="$RUNNER_TEMP/ref"
          rm -rf "$REF" && mkdir -p "$REF/patch-base"
          for f in xime-flush-bottom.patch \
                   patch-base/XimeInputMethodService.kt patch-base/KeyboardLayout.kt \
                   patch-base/KeyButton.kt patch-base/KeyboardTheme.kt; do
            gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/$f?ref=main" > "$REF/$f"
          done
          echo "已取回："
          wc -l "$REF/xime-flush-bottom.patch" "$REF/patch-base/XimeInputMethodService.kt" \
                "$REF/patch-base/KeyboardLayout.kt" "$REF/patch-base/KeyButton.kt" "$REF/patch-base/KeyboardTheme.kt"

      - name: 套用补丁（三方合并，自动适配上游改动）
        run: |
          set -uo pipefail
          WS="$GITHUB_WORKSPACE"
          REF="$RUNNER_TEMP/ref"
          PATCH="$REF/xime-flush-bottom.patch"
          BASE="$REF/patch-base"
          F1="app/src/main/java/com/kingzcheung/xime/service/XimeInputMethodService.kt"
          F2="app/src/main/java/com/kingzcheung/xime/ui/keyboard/KeyboardLayout.kt"
          F3="app/src/main/java/com/kingzcheung/xime/ui/keyboard/KeyButton.kt"
          F4="app/src/main/java/com/kingzcheung/xime/ui/theme/KeyboardTheme.kt"
          N1="XimeInputMethodService.kt"
          N2="KeyboardLayout.kt"
          N3="KeyButton.kt"
          N4="KeyboardTheme.kt"

          echo "── 1) 把补丁作用在 base 副本上，还原出「我们改完的版本」──"
          rm -rf "$RUNNER_TEMP/base" && mkdir -p "$RUNNER_TEMP/base"
          cd "$RUNNER_TEMP/base" && git init -q .
          mkdir -p "$(dirname "$F1")" "$(dirname "$F2")" "$(dirname "$F3")" "$(dirname "$F4")"
          cp "$BASE/$N1" "$F1"
          cp "$BASE/$N2" "$F2"
          cp "$BASE/$N3" "$F3"
          cp "$BASE/$N4" "$F4"
          if ! git apply "$PATCH"; then
            echo "::error::补丁在本仓库保存的 base 文件上都套不上 —— patch-base/ 与 xime-flush-bottom.patch 不配对，请一起重新生成"
            exit 1
          fi
          cp "$F1" "$RUNNER_TEMP/post-$N1"
          cp "$F2" "$RUNNER_TEMP/post-$N2"
          cp "$F3" "$RUNNER_TEMP/post-$N3"
          cp "$F4" "$RUNNER_TEMP/post-$N4"
          echo "  ✓ base + 补丁 = 目标版本（各 $(wc -l < "$F1") / $(wc -l < "$F2") / $(wc -l < "$F3") / $(wc -l < "$F4") 行）"

          echo "── 2) 与上游最新代码做三方合并 ──"
          cd "$WS"
          CONFLICT=0
          for pair in "$F1|$N1" "$F2|$N2" "$F3|$N3" "$F4|$N4"; do
            rel="${pair%%|*}"; n="${pair##*|}"
            if git merge-file -p -L "上游最新/$n" -L "改动前的原版/$n" -L "我们改完的/$n" \
                 "$WS/$rel" "$BASE/$n" "$RUNNER_TEMP/post-$n" > "$RUNNER_TEMP/merged-$n" 2>"$RUNNER_TEMP/merr-$n"; then
              echo "  ✓ $n 干净合并（$(wc -l < "$RUNNER_TEMP/merged-$n") 行）"
              cp "$RUNNER_TEMP/merged-$n" "$WS/$rel"
            else
              echo "::error::$n 三方合并冲突：上游改的正是我们改动的那几行，补丁需要人工更新"
              echo "────── $n 冲突片段 ──────"
              grep -n -A8 '^<<<<<<<' "$RUNNER_TEMP/merged-$n" | head -80 || true
              echo "──────────────────────────"
              cp "$RUNNER_TEMP/merged-$n" "$WS/CONFLICT-$n"
              CONFLICT=1
            fi
          done
          if [ "$CONFLICT" != "0" ]; then
            echo "::error::补丁已失效。请用上游最新代码重新生成 xime-flush-bottom.patch 与 patch-base/ 后再试"
            exit 1
          fi

          echo "── 3) 校验补丁效果确实生效 ──"
          fail=0
          c=$(grep -c -F 'if (rawDp > 38)' "$WS/$F1" || true)
          if [ "$c" != "2" ]; then echo "::error::'if (rawDp > 38)' 出现 $c 次，应为 2 次"; fail=1; fi
          if grep -q -F 'val minBottomDp' "$WS/$F1"; then echo "::error::仍存在 val minBottomDp（18dp 兜底没去掉）"; fail=1; fi
          # 键区断言只看**代码行**：补丁自带的注释里会提到旧值 8.dp，直接 grep 会误判。
          # （上游该行现为 `.padding(start = if (tabletParams) 16.dp else 4.dp, …, bottom = 8.dp)`，
          #   我们只把 bottom 归零、保留上游新增的平板留边逻辑。）
          grep -v '^[[:space:]]*//' "$WS/$F2" > "$RUNNER_TEMP/f2code.kt" || true
          c2=$(grep -c -F 'bottom = 0.dp' "$RUNNER_TEMP/f2code.kt" || true)
          if [ "$c2" != "1" ]; then echo "::error::键区代码里 'bottom = 0.dp' 出现 $c2 次，应为 1 次"; fail=1; fi
          if grep -q -F 'bottom = 8.dp' "$RUNNER_TEMP/f2code.kt"; then echo "::error::键区代码里仍是 bottom = 8.dp"; fail=1; fi
          if ! grep -q -F 'BOTTOM_ROW_OUTER_CORNER_RADIUS' "$WS/$F2"; then echo "::error::底排外侧圆角补丁丢失（BOTTOM_ROW_OUTER_CORNER_RADIUS 未出现）"; fail=1; fi
          if ! grep -q -F 'KeyboardThemes.isKeycapHidden(themeId)' "$WS/$F2"; then echo "::error::「无键帽」主题取色补丁丢失（isKeycapHidden 未调用）"; fail=1; fi
          # KeyButton.kt：透明底色分支应出现 6 次（5 个键面 + crispShadowColor 一处）
          c3=$(grep -c -F 'backgroundColor.alpha < 0.05f' "$WS/$F3" || true)
          if [ "$c3" != "6" ]; then echo "::error::$N3 里『透明底色分支』出现 $c3 次，应为 6 次"; fail=1; fi
          if ! grep -q -F 'HIDDEN_KEYCAP_ID' "$WS/$F4"; then echo "::error::「无键帽」主题定义丢失（HIDDEN_KEYCAP_ID 未出现）"; fail=1; fi
          if [ "$fail" != "0" ]; then exit 1; fi
          echo "  ✓ 两处 38dp 阈值 + 去掉 18dp 兜底 + 键区内边距归零 + 底排外侧圆角 + 内置「无键帽」主题，全部到位"
          echo "── 相对上游的最终改动 ──"
          git --no-pager diff --stat

      - name: 自检 —— 三方合并对上游邻近改动的容忍度与失败可见性
        # 纯体检步骤，不阻塞真正的构建（真正的保护是上一步的合并与断言）。
        # 它演示两个方向：① 上游改到 hunk 上下文里「隔开几行」的一条 —— 逐行 apply 已套不上，
        # 但三方合并能干净绕开；② 上游改的正是「紧贴」我们改动的那条 —— 三方合并明确报冲突。
        if: github.event.inputs.force == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          REF="$RUNNER_TEMP/ref"
          BASE="$REF/patch-base"
          PATCH="$REF/xime-flush-bottom.patch"
          F1="app/src/main/java/com/kingzcheung/xime/service/XimeInputMethodService.kt"
          F2="app/src/main/java/com/kingzcheung/xime/ui/keyboard/KeyboardLayout.kt"
          F3="app/src/main/java/com/kingzcheung/xime/ui/keyboard/KeyButton.kt"
          F4="app/src/main/java/com/kingzcheung/xime/ui/theme/KeyboardTheme.kt"
          N1="XimeInputMethodService.kt"
          N2="KeyboardLayout.kt"
          N3="KeyButton.kt"
          N4="KeyboardTheme.kt"
          # 补丁 hunk 里的两条上下文行（本补丁并不修改它们）：
          TOL="// 标准（三键）导航栏 inset 明显大于手势条，额外多减一点，"   # 距改动 3 行
          ADJ="val extraShrinkDp = if (rawDp >= 120) 8 else 0"                # 紧贴改动

          perturb () {   # 把 base 文件里第一条含 $1 的行末尾加段注释，模拟「上游改了这行」
            rm -rf "$RUNNER_TEMP/pert"
            mkdir -p "$RUNNER_TEMP/pert/$(dirname "$F1")" "$RUNNER_TEMP/pert/$(dirname "$F2")" \
                     "$RUNNER_TEMP/pert/$(dirname "$F3")" "$RUNNER_TEMP/pert/$(dirname "$F4")"
            awk -v t="$1" 'n==0 && index($0,t){print $0 "  // upstream-touched"; n=1; next} {print}' \
              "$BASE/$N1" > "$RUNNER_TEMP/pert/$F1"
            cp "$BASE/$N2" "$RUNNER_TEMP/pert/$F2"
            cp "$BASE/$N3" "$RUNNER_TEMP/pert/$F3"
            cp "$BASE/$N4" "$RUNNER_TEMP/pert/$F4"
            ( cd "$RUNNER_TEMP/pert" && git init -q . )
          }

          case_run () {  # $1=场景名  $2=扰动目标行  $3=期望的 merge 结果(clean|conflict)
            perturb "$2"
            if ( cd "$RUNNER_TEMP/pert" && git apply --check "$PATCH" ) >/dev/null 2>&1; then
              echo "::warning::[$1] 旧做法 git apply --check 竟然还能套上（扰动没落进上下文窗口）"
            else
              echo "  [$1] 旧做法（逐行 git apply）-> 失败（符合预期：逐行匹配很脆）"
            fi
            if git merge-file -p "$RUNNER_TEMP/pert/$F1" "$BASE/$N1" "$RUNNER_TEMP/post-$N1" \
                 > "$RUNNER_TEMP/st-$1.kt" 2>"$RUNNER_TEMP/err-$1.txt"; then got=clean; else got=conflict; fi
            if [ "$got" = "$3" ]; then
              echo "  [$1] 新做法（三方合并）-> $got（符合预期）"
            else
              echo "::warning::[$1] 新做法（三方合并）-> $got，与预期 $3 不符"
            fi
          }

          echo "① 上游改了 hunk 上下文里「隔开几行」的一条 ——"
          case_run tol "$TOL" clean
          echo "② 上游改的正是「紧贴」我们改动的那一条 ——"
          case_run adj "$ADJ" conflict
          echo "结论：三方合并能容忍『邻近但不重叠』的上游改动（这些改动逐行 apply 已经套不上）；"
          echo "      一旦真的与我们改动的那几行重叠，它会明确报冲突，而不是静默出错。"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            gradle/libs.versions.toml
            **/*.gradle*
            **/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK and SDK platform
        run: |
          sdkmanager "ndk;29.0.14206865" "platforms;android-37.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache native deps
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs/**/libonnxruntime.so
          key: native-${{ runner.os }}-${{ hashFiles('app/build-logic/tasks-native.gradle.kts') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon --refresh-dependencies

      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
            app/src/main/jni/boost
            app/src/main/jni/boost-*.tar.xz
          key: cmake-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Rust (xime-plugin CLI)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/xime-plugin/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/xime-plugin/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build Plugins (TS -> JS)
        run: |
          cd tools/xime-plugin
          cargo run --quiet -- build --all --plugins-dir ../../plugins --out ../../build/plugin-js
          cargo run --quiet -- build test-fixture --out ../../build/plugin-js

      - name: 写入签名配置（release 必需；只在 runner 上落地，不提交）
        if: needs.check.outputs.variant == 'release'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          [ -n "${SIGNING_KEY:-}" ] || { echo "::error::仓库缺少 SIGNING_KEY secret，release 无法签名"; exit 1; }
          [ -n "${KEY_STORE_PASSWORD:-}" ] || { echo "::error::仓库缺少 KEY_STORE_PASSWORD secret"; exit 1; }
          [ -n "${KEY_ALIAS:-}" ] || { echo "::error::仓库缺少 ALIAS secret"; exit 1; }
          [ -n "${KEY_PASSWORD:-}" ] || { echo "::error::仓库缺少 KEY_PASSWORD secret"; exit 1; }
          cat > app/keystore.properties <<EOF
          keyBase64=${SIGNING_KEY}
          storePassword=${KEY_STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          echo "已写入 app/keystore.properties（$(( $(wc -c < app/keystore.properties) )) 字节，不入库）"
          git status --porcelain app/keystore.properties || true

      - name: Build APK
        run: |
          if [ "${{ needs.check.outputs.variant }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: 校验 release 签名
        if: needs.check.outputs.variant == 'release'
        run: |
          set -e
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" >/dev/null
            echo "已验签: $apk"
          done

      - name: 选定 APK 并核对内含架构
        id: pick
        run: |
          set -euo pipefail
          DIR="app/build/outputs/apk/${{ needs.check.outputs.variant }}"
          echo "产物目录："
          ls -l "$DIR"
          APK=$(find "$DIR" -name "*-${TARGET_ABI}.apk" | head -1)
          STRICT=1
          if [ -z "$APK" ]; then
            echo "::warning::没找到 ${TARGET_ABI} 专属包，退回 universal"
            APK=$(find "$DIR" -name '*universal.apk' | head -1)
            STRICT=0
          fi
          [ -n "$APK" ] || { echo "::error::目录里没有 APK"; exit 1; }
          echo "选中: $APK"
          echo "内含 native 架构："
          unzip -l "$APK" | grep -o 'lib/[^/]*/' | sort -u
          if [ "$STRICT" = "1" ]; then
            BAD=$(unzip -l "$APK" | grep -o 'lib/[^/]*/' | sed 's#lib/##; s#/##' | sort -u | grep -v -x "$TARGET_ABI" || true)
            if [ -n "$BAD" ]; then
              echo "::error::选中的 APK 里含非目标架构（$(echo "$BAD" | tr '\n' ' ')），应只有 $TARGET_ABI —— 选取逻辑出错了"
              exit 1
            fi
            echo "  ✓ 只含 $TARGET_ABI"
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: 收集失败现场（仅失败时；基准文件在 $RUNNER_TEMP，要先拷回工作区）
        if: failure()
        run: |
          mkdir -p patch-base
          cp -f "$RUNNER_TEMP/ref/patch-base/"*.kt patch-base/ 2>/dev/null || true
          cp -f "$RUNNER_TEMP/ref/xime-flush-bottom.patch" . 2>/dev/null || true
          ls -l patch-base 2>/dev/null || true
          ls -l CONFLICT-*.kt 2>/dev/null || true

      - name: 上传冲突文件（仅在失败时可复盘）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: patch-conflict-dump
          path: |
            CONFLICT-*.kt
            patch-base/**
            xime-flush-bottom.patch
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: patched-${{ needs.check.outputs.variant }}-apk
          path: app/build/outputs/apk/${{ needs.check.outputs.variant }}/*.apk
          retention-days: 30

      - name: 发布到 Release（固定标签，永久链接）
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VARIANT: ${{ needs.check.outputs.variant }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -e
          APK="${{ steps.pick.outputs.apk }}"
          OUT="xime-patched-${VARIANT}-${TARGET_ABI}.apk"
          cp "$APK" "$OUT"
          UP=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          SHA256=$(sha256sum "$OUT" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$OUT")
          if [ "$VARIANT" = "release" ]; then
            TITLE="Xime 贴底补丁版 · release（arm64，自动跟随上游）"
            KIND="release（R8 精简 + 资源压缩）"
            SIGN="固定密钥签名（密钥存在本仓库 Secrets 里）—— 以后**可直接覆盖安装升级，不会丢 Rime 数据**"
          else
            TITLE="Xime 贴底补丁版 · debug（arm64，自动跟随上游）"
            KIND="debug"
            SIGN="调试密钥（每次构建可能不同）—— 更新前需要先卸载"
          fi
          NOTES=$(printf '跟随上游 ximeiorg/Xime 自动构建的「键盘底部贴底」补丁版。\n\n<!-- upstream-sha: %s -->\n\n- 上游 commit: `%s`\n- 构建类型: %s\n- 目标架构: 仅 `%s`（现代手机适用；其他架构请改工作流的 TARGET_ABI）\n- 补丁: 手势导航下键区贴到屏幕底边（inset ≤ 38dp 不留白；三键导航仍避让）\n- 新增主题: 「无键帽」——键面不显示底色（透明），仅按下/高亮时给出提示；在主题里选中才生效，其它主题观感不变\n- 融合方式: 三方合并（自动适配上游改动），冲突时构建会失败并给出冲突片段\n- 包名: com.kingzcheung.xime —— 与官方同包名，首次安装前必须先卸载官方版\n- 签名: %s\n- sha256: `%s`\n- 大小: %s 字节\n- 构建记录: https://github.com/%s/actions\n' "$UP" "$SHORT" "$KIND" "$TARGET_ABI" "$SIGN" "$SHA256" "$SIZE" "$GITHUB_REPOSITORY")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" "$OUT" --repo "$GITHUB_REPOSITORY" --clobber
          echo "已发布: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "永久链接: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$OUT"
          {
            echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$OUT"
            echo "sha=$SHORT"
            echo "sha256=$SHA256"
            echo "size=$SIZE"
            echo "variant=$VARIANT"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

  notify:
    needs: build
    runs-on: ubuntu-latest
    env:
      # GitHub 的 steps[*].if 不允许引用 secrets 上下文；先把 secret 提升成 env 才能在 if 里判断。
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - name: 发送邮件通知（未配置 MAIL_TO 时自动跳过，且永不影响构建结果）
        if: env.MAIL_TO != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SMTP_SERVER }}
          server_port: ${{ secrets.MAIL_SMTP_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Xime 贴底补丁版新 APK 已构建（${{ needs.build.outputs.variant }} · ${{ needs.build.outputs.sha }}）"
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          body: |
            Xime「键盘底部贴底」补丁版 APK 已自动跟随上游更新并重新构建、发布。

            上游 commit : ${{ needs.build.outputs.sha }}
            构建类型    : ${{ needs.build.outputs.variant }}
            目标架构    : 仅 arm64-v8a
            sha256     : ${{ needs.build.outputs.sha256 }}
            大小        : ${{ needs.build.outputs.size }} 字节

            永久下载链接（固定，覆盖安装即可升级，不丢 Rime 数据）:
            ${{ needs.build.outputs.url }}

            —— 由 fork lw-zg/Xime 的 build-patched.yml 自动发出
