# 跟随上游 ximeiorg/Xime 自动构建「键盘底部贴底」补丁版 APK
#
# ── 触发策略：release 才编译；源码始终跟上游最新 ────────────────────────
# 上游平时往 main 推的 commit，我们**随时可以拉取**（编译就直接检出 main 的最新提交）；
# 但**只有当上游发布正式 release**（GitHub 的 releases/latest，天然排除 nightly 这类
# prerelease 与 draft）时，才真正**开始编译** —— 用 release 的 tag 变化当「闸门」。
# 编译时源码取上游 **main 最新提交**，并把它在 app/build.gradle.kts 里声明的**上游版本号**
# （versionName / versionCode）显式回灌进产物，保证版本号与上游同步。
# 为何检出 main 而不是 release 的 tag：patch-base/ 是对着 main 快照生成的，检出更旧的 tag
# 会让三方合并反向而冲突；而且需求本身是「有新 commit 可以拉取」。
# 需要提前验证某个未发布的提交时，手动触发并填 `ref`（如某 tag / 分支）即可 ——
# 这时源码与版本号都以该 `ref` 为准。
#
# ── 产物 ───────────────────────────────────────────────────────────────
# 默认构建 **release**（R8 精简 + 资源压缩），且只打包 **arm64-v8a**，用**固定密钥**签名：
#   · release   -> Release 标签 `patched-apk`        （永久链接，可覆盖安装升级）
#   · debug     -> Release 标签 `patched-apk-debug`  （手动触发时的备用路径）
# 资产名带上游版本号（`xime-patched-release-3.1.0-arm64-v8a.apk`），同时保留一个不带版本号的
# **稳定别名**（`xime-patched-release-arm64-v8a.apk`）—— 永久链接始终指向最新版，不会因改名失效。
# 只取 arm64-v8a 一个架构：现代手机都是它，能省掉另外 3 份 native 库（约 35 MB×3）。
# ⚠ 曾经踩过的坑：以前用 `find ... | head -1` 随手取一个 APK，结果发布出去的是 **x86_64**
#   那一份（真机装上去加载不到 librime 会崩）。现在改成按 TARGET_ABI 明确挑选，
#   并在发布前**核对 APK 内的 native 架构**，不符就红。
#
# ── 补丁是怎么"动态"适配上游的 ──────────────────────────────────────────
# 不再用逐行精确匹配的 git apply（上游一改邻近代码就套不上），改成三方合并：
#     current = 上游最新文件（本次检出）
#     base    = patch-base/<文件> 里保存的「改动前的原版文件」
#     other   = 把 xime-flush-bottom.patch 作用在 base 上还原出的「我们改完的版本」
#   git merge-file 会把「我们相对 base 的那点改动」搬到上游最新代码上：
#   上游在别处、甚至就在我们改的那几行上下动刀都不影响；
#   只有真正改了同一行（语义冲突）才会冲突 —— 那时报错 + 打印冲突片段 + 构建失败，绝不静默出错。
#
# ── 其他要点 ──────────────────────────────────────────────────────────
#  - 不向 fork 推代码。签名密钥从本仓库 Secrets 注入（SIGNING_KEY / KEY_STORE_PASSWORD /
#    ALIAS / KEY_PASSWORD），只在 runner 上落地成 app/keystore.properties，不提交。
#  - 上游 nightly.yml / release.yml 依赖 secrets.SIGNING_KEY 等签名密钥，fork 里没有；
#    GitHub 已自动把它们标成 disabled_fork，不要手动启用。
#  - ⚠ 本工作流的构建步骤是上游 build.yml / release.yml 的副本（已做 ABI 收敛）。
#    上游若改了构建方式（NDK 版本、依赖下载等），这里需要同步跟进，否则会构建失败（会变红，不会静默）。
#  - 构建并发布成功后，若仓库配置了 MAIL_* 系列 Secrets（MAIL_TO / MAIL_FROM / MAIL_SMTP_SERVER /
#    MAIL_SMTP_PORT / MAIL_USERNAME / MAIL_PASSWORD），会通过 dawidd6/action-send-mail 发一封
#    邮件通知（收件人、SMTP 等都只存在 Secrets 里；没配置就自动跳过，不影响任何构建步骤）。
name: Build patched APK (follow upstream)

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '即使上游 release 未变化也强制重新构建（同时跑一遍三方合并自检）'
        required: false
        type: boolean
        default: false
      variant:
        description: '构建类型：release = 签名精简版（推荐）；debug = 调试版'
        required: false
        type: choice
        options:
          - release
          - debug
        default: release
      ref:
        description: '手动指定上游源码引用（留空 = 上游 main 最新提交；可填某 tag/分支以构建指定提交，版本号随之取该引用）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: build-patched-apk
  cancel-in-progress: false

env:
  # 只打这一种架构。想改回通用包就把下面改成 universal 之外的策略并调整选取逻辑。
  TARGET_ABI: arm64-v8a

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      sha: ${{ steps.decide.outputs.sha }}
      ref: ${{ steps.decide.outputs.ref }}
      rel: ${{ steps.decide.outputs.rel }}
      version: ${{ steps.decide.outputs.version }}
      version_code: ${{ steps.decide.outputs.version_code }}
      mode: ${{ steps.decide.outputs.mode }}
      variant: ${{ steps.decide.outputs.variant }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: 以上游正式 release 为闸门；构建源取 main 最新提交并同步版本号
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          UP=ximeiorg/Xime
          VARIANT="${{ github.event.inputs.variant }}"
          [ -n "$VARIANT" ] || VARIANT=release
          if [ "$VARIANT" = "debug" ]; then TAG=patched-apk-debug; else TAG=patched-apk; fi
          MREF="${{ github.event.inputs.ref }}"

          # ① 「闸门」= 上游最新正式 release 的 tag。
          #    GitHub 的 releases/latest 天然排除 prerelease（如上游 nightly）与 draft，
          #    正好对应「等上游发布正式 release 再编译」。
          REL=$(gh api "repos/$UP/releases/latest" --jq .tag_name 2>/dev/null || true)
          [ -n "$REL" ] || REL="<none>"

          # ② 「构建源」= 上游 main 最新提交（有新 commit 随时可拉取）；手动指定则用 ref。
          if [ -n "$MREF" ]; then REF="$MREF"; MODE=manual; else REF=main; MODE=release; fi
          echo "上游正式 release = $REL ；本次构建源 = $REF（$MODE 轨道）"

          # 解析该引用指向的提交（tag 优先解引用 ^{}，退而求其次直接取 tag / 分支）
          SHA=$(git ls-remote "https://github.com/$UP.git" "refs/tags/$REF^{}" | cut -f1 || true)
          [ -n "$SHA" ] || SHA=$(git ls-remote "https://github.com/$UP.git" "refs/tags/$REF" | cut -f1 || true)
          [ -n "$SHA" ] || SHA=$(git ls-remote "https://github.com/$UP.git" "refs/heads/$REF" | cut -f1 || true)
          [ -n "$SHA" ] || { echo "::error::无法解析上游引用 $REF"; exit 1; }
          echo "上游 $REF = $SHA"

          # ③ 真正「同步上游版本号」：直接从**构建源**的 app/build.gradle.kts 里读
          GURL="repos/$UP/contents/app/build.gradle.kts?ref=$REF"
          GRADLE=$(gh api "$GURL" -H "Accept: application/vnd.github.raw" 2>/dev/null || true)
          VER=$(printf '%s\n' "$GRADLE" | grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VC=$(printf '%s\n' "$GRADLE" | grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -z "$VER" ]; then echo "::error::无法从 $REF 的 app/build.gradle.kts 读取 versionName"; exit 1; fi
          echo "上游版本 = $VER (versionCode ${VC:-<未读到>})"

          # ④ 比对的是**闸门（release tag）**，不是构建源 —— 否则恒等于 main 会永远跳过
          LASTREL=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null | grep -o 'upstream-release: [^ ]*' | head -1 | cut -d' ' -f2 || true)
          echo "上次编译时的上游 release = ${LASTREL:-<无记录>}"

          {
            echo "rel=$REL"
            echo "ref=$REF"
            echo "sha=$SHA"
            echo "version=$VER"
            echo "version_code=$VC"
            echo "mode=$MODE"
            echo "variant=$VARIANT"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "手动强制构建"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "manual" ]; then
            echo "手动指定源码引用 $REF，构建"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$REL" = "<none>" ]; then
            echo "上游尚无正式 release，本次跳过（手动触发可加 force 或指定 ref）"
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ "$REL" = "$LASTREL" ]; then
            echo "上游正式 release 未变化（$REL），跳过构建"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "上游有新正式 release（$REL），开始构建"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.publish.outputs.url }}
      url_v: ${{ steps.publish.outputs.url_v }}
      sha: ${{ steps.publish.outputs.sha }}
      sha256: ${{ steps.publish.outputs.sha256 }}
      size: ${{ steps.publish.outputs.size }}
      variant: ${{ steps.publish.outputs.variant }}
      tag: ${{ steps.publish.outputs.tag }}
      ref: ${{ steps.publish.outputs.ref }}
      rel: ${{ steps.publish.outputs.rel }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: 检出上游源码（构建源 = main 最新提交 / 手动指定的 ref）
        uses: actions/checkout@v7
        with:
          repository: ximeiorg/Xime
          ref: ${{ needs.check.outputs.ref }}
          fetch-depth: 1
          submodules: recursive

      - name: 取回补丁与基准文件（它们在本 fork 的 main 上，不在上游代码树里）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="$RUNNER_TEMP/ref"
          rm -rf "$REF" && mkdir -p "$REF/patch-base"
          for f in xime-flush-bottom.patch \
                   patch-base/XimeInputMethodService.kt patch-base/KeyboardLayout.kt \
                   patch-base/KeyButton.kt patch-base/KeyboardTheme.kt \
                   patch-base/xime.yaml \
                   patch-base/ThemeSettingsScreen.kt patch-base/ThemeSettingsViewModel.kt \
                   patch-base/SwipeBubble.kt patch-base/SymbolKeyboardLayout.kt; do
            gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/$f?ref=main" > "$REF/$f"
          done
          echo "已取回："
          wc -l "$REF/xime-flush-bottom.patch" "$REF/patch-base/XimeInputMethodService.kt" \
                "$REF/patch-base/KeyboardLayout.kt" "$REF/patch-base/KeyButton.kt" \
                "$REF/patch-base/KeyboardTheme.kt" "$REF/patch-base/xime.yaml" \
                "$REF/patch-base/ThemeSettingsScreen.kt" "$REF/patch-base/ThemeSettingsViewModel.kt" \
                "$REF/patch-base/SwipeBubble.kt" "$REF/patch-base/SymbolKeyboardLayout.kt"

      - name: 套用补丁（三方合并，自动适配上游改动）
        run: |
          set -uo pipefail
          WS="$GITHUB_WORKSPACE"
          REF="$RUNNER_TEMP/ref"
          PATCH="$REF/xime-flush-bottom.patch"
          BASE="$REF/patch-base"
          F1="app/src/main/java/com/kingzcheung/xime/service/XimeInputMethodService.kt"
          F2="app/src/main/java/com/kingzcheung/xime/ui/keyboard/KeyboardLayout.kt"
          F3="app/src/main/java/com/kingzcheung/xime/ui/keyboard/KeyButton.kt"
          F4="app/src/main/java/com/kingzcheung/xime/ui/theme/KeyboardTheme.kt"
          F5="app/src/main/assets/xime.yaml"
          F6="app/src/main/java/com/kingzcheung/xime/ui/settings/ThemeSettingsScreen.kt"
          F7="app/src/main/java/com/kingzcheung/xime/viewmodel/ThemeSettingsViewModel.kt"
          F8="app/src/main/java/com/kingzcheung/xime/ui/keyboard/SwipeBubble.kt"
          F9="app/src/main/java/com/kingzcheung/xime/ui/keyboard/SymbolKeyboardLayout.kt"
          N1="XimeInputMethodService.kt"
          N2="KeyboardLayout.kt"
          N3="KeyButton.kt"
          N4="KeyboardTheme.kt"
          N5="xime.yaml"
          N6="ThemeSettingsScreen.kt"
          N7="ThemeSettingsViewModel.kt"
          N8="SwipeBubble.kt"
          N9="SymbolKeyboardLayout.kt"

          echo "── 1) 把补丁作用在 base 副本上，还原出「我们改完的版本」──"
          rm -rf "$RUNNER_TEMP/base" && mkdir -p "$RUNNER_TEMP/base"
          cd "$RUNNER_TEMP/base" && git init -q .
          mkdir -p "$(dirname "$F1")" "$(dirname "$F2")" "$(dirname "$F3")" "$(dirname "$F4")" "$(dirname "$F5")" \
                   "$(dirname "$F6")" "$(dirname "$F7")" "$(dirname "$F8")"
          cp "$BASE/$N1" "$F1"
          cp "$BASE/$N2" "$F2"
          cp "$BASE/$N3" "$F3"
          cp "$BASE/$N4" "$F4"
          cp "$BASE/$N5" "$F5"
          cp "$BASE/$N6" "$F6"
          cp "$BASE/$N7" "$F7"
          cp "$BASE/$N8" "$F8"
          cp "$BASE/$N9" "$F9"
          if ! git apply "$PATCH"; then
            echo "::error::补丁在本仓库保存的 base 文件上都套不上 —— patch-base/ 与 xime-flush-bottom.patch 不配对，请一起重新生成"
            exit 1
          fi
          cp "$F1" "$RUNNER_TEMP/post-$N1"
          cp "$F2" "$RUNNER_TEMP/post-$N2"
          cp "$F3" "$RUNNER_TEMP/post-$N3"
          cp "$F4" "$RUNNER_TEMP/post-$N4"
          cp "$F5" "$RUNNER_TEMP/post-$N5"
          cp "$F6" "$RUNNER_TEMP/post-$N6"
          cp "$F7" "$RUNNER_TEMP/post-$N7"
          cp "$F8" "$RUNNER_TEMP/post-$N8"
          cp "$F9" "$RUNNER_TEMP/post-$N9"
          echo "  ✓ base + 补丁 = 目标版本（各 $(wc -l < "$F1") / $(wc -l < "$F2") / $(wc -l < "$F3") / $(wc -l < "$F4") / $(wc -l < "$F5") / $(wc -l < "$F6") / $(wc -l < "$F7") / $(wc -l < "$F8") / $(wc -l < "$F9") 行）"

          echo "── 2) 与上游最新代码做三方合并 ──"
          cd "$WS"
          CONFLICT=0
          for pair in "$F1|$N1" "$F2|$N2" "$F3|$N3" "$F4|$N4" "$F5|$N5" "$F6|$N6" "$F7|$N7" "$F8|$N8" "$F9|$N9"; do
            rel="${pair%%|*}"; n="${pair##*|}"
            if git merge-file -p -L "上游最新/$n" -L "改动前的原版/$n" -L "我们改完的/$n" \
                 "$WS/$rel" "$BASE/$n" "$RUNNER_TEMP/post-$n" > "$RUNNER_TEMP/merged-$n" 2>"$RUNNER_TEMP/merr-$n"; then
              echo "  ✓ $n 干净合并（$(wc -l < "$RUNNER_TEMP/merged-$n") 行）"
              cp "$RUNNER_TEMP/merged-$n" "$WS/$rel"
            else
              echo "::error::$n 三方合并冲突：上游改的正是我们改动的那几行，补丁需要人工更新"
              echo "────── $n 冲突片段 ──────"
              grep -n -A8 '^<<<<<<<' "$RUNNER_TEMP/merged-$n" | head -80 || true
              echo "──────────────────────────"
              cp "$RUNNER_TEMP/merged-$n" "$WS/CONFLICT-$n"
              CONFLICT=1
            fi
          done
          if [ "$CONFLICT" != "0" ]; then
            echo "::error::补丁已失效。请用上游最新代码重新生成 xime-flush-bottom.patch 与 patch-base/ 后再试"
            exit 1
          fi

          echo "── 3) 校验补丁效果确实生效 ──"
          fail=0
          c=$(grep -c -F 'if (rawDp > 38)' "$WS/$F1" || true)
          if [ "$c" != "2" ]; then echo "::error::'if (rawDp > 38)' 出现 $c 次，应为 2 次"; fail=1; fi
          if grep -q -F 'val minBottomDp' "$WS/$F1"; then echo "::error::仍存在 val minBottomDp（18dp 兜底没去掉）"; fail=1; fi
          # 键区断言只看**代码行**：补丁自带的注释里会提到旧值 8.dp，直接 grep 会误判。
          # （上游该行现为 `.padding(start = if (tabletParams) 16.dp else 4.dp, …, bottom = 8.dp)`，
          #   我们只把 bottom 归零、保留上游新增的平板留边逻辑。）
          grep -v '^[[:space:]]*//' "$WS/$F2" > "$RUNNER_TEMP/f2code.kt" || true
          c2=$(grep -c -F 'bottom = 0.dp' "$RUNNER_TEMP/f2code.kt" || true)
          if [ "$c2" != "1" ]; then echo "::error::键区代码里 'bottom = 0.dp' 出现 $c2 次，应为 1 次"; fail=1; fi
          if grep -q -F 'bottom = 8.dp' "$RUNNER_TEMP/f2code.kt"; then echo "::error::键区代码里仍是 bottom = 8.dp"; fail=1; fi
          if ! grep -q -F 'BOTTOM_ROW_OUTER_CORNER_RADIUS' "$WS/$F2"; then echo "::error::底排外侧圆角补丁丢失（BOTTOM_ROW_OUTER_CORNER_RADIUS 未出现）"; fail=1; fi
          if ! grep -q -F 'KeyboardThemes.isKeycapHidden(themeId)' "$WS/$F2"; then echo "::error::「无键帽」主题取色补丁丢失（isKeycapHidden 未调用）"; fail=1; fi
          # 误触修复：滑键改判（松手时按最终落点改判按键，指腹先触发的行不再抢先生效）
          if ! grep -q -F 'SlideKeyRegistry' "$WS/$F2"; then echo "::error::滑键注册表丢失（SlideKeyRegistry 未出现）—— 误触修复失效"; fail=1; fi
          if ! grep -q -F 'LocalSlideKeyRegistry' "$WS/$F2"; then echo "::error::滑键注册表 CompositionLocal 丢失"; fail=1; fi
          if ! grep -q -F 'awaitEachGesture' "$WS/$F2"; then echo "::error::滑键改判手势丢失（awaitEachGesture 未出现）"; fail=1; fi
          if ! grep -q -F 'getKeyCommitValue(lastKey' "$WS/$F2"; then echo "::error::改判未现取 commit 值（shift 大写会失效）"; fail=1; fi
          if ! grep -q -F 'dispatchKeyActionOrPress(tap, commit' "$WS/$F2"; then echo "::error::改判未走真实按键的分发路径"; fail=1; fi
          # KeyButton.kt：透明底色分支应出现 11 次（crispShadowColor 1 处 + 5 个键面站点 × [底色分支 + 边框]）
          c3=$(grep -c -F 'backgroundColor.alpha < 0.05f' "$WS/$F3" || true)
          if [ "$c3" != "11" ]; then echo "::error::$N3 里『透明底色分支』出现 $c3 次，应为 11 次"; fail=1; fi
          if ! grep -q -F 'alpha = 0.35f' "$WS/$F3"; then echo "::error::无键帽按键边框丢失（alpha = 0.35f 未出现）"; fail=1; fi
          if ! grep -q -F 'suppressClick' "$WS/$F3"; then echo "::error::滑键点击抑制丢失（suppressClick 未出现）—— 可能重复触发"; fail=1; fi
          if ! grep -q -F 'HIDDEN_KEYCAP_ID' "$WS/$F4"; then echo "::error::「无键帽」主题 id 兼容丢失（HIDDEN_KEYCAP_ID 未出现）"; fail=1; fi
          if ! grep -q -F 'if (isKeycapHidden(themeId)) return Color.Transparent' "$WS/$F4"; then echo "::error::「无键帽」取色守卫丢失（getKeyBgColorOverride 未返回透明）"; fail=1; fi
          if ! grep -q -F 'KEY_NO_KEYCAP_MODE' "$WS/$F4"; then echo "::error::无键帽开关持久化丢失（KEY_NO_KEYCAP_MODE 未出现）"; fail=1; fi
          if ! grep -q -F 'isNoKeycapModeEnabled' "$WS/$F4"; then echo "::error::无键帽全局开关读取丢失（isNoKeycapModeEnabled 未出现）"; fail=1; fi
          if ! grep -q -F 'setNoKeycapMode' "$WS/$F4"; then echo "::error::无键帽全局开关写入丢失（setNoKeycapMode 未出现）"; fail=1; fi
          # 主题设置页：无键帽模式开关（对所有主题生效）
          if ! grep -q -F 'Switch(' "$WS/$F6"; then echo "::error::主题设置页开关丢失（Switch 未出现）"; fail=1; fi
          if ! grep -q -F '无键帽模式' "$WS/$F6"; then echo "::error::主题设置页「无键帽模式」文案丢失"; fail=1; fi
          if ! grep -q -F 'uiState.noKeycapMode' "$WS/$F6"; then echo "::error::主题设置页未绑定 noKeycapMode 状态"; fail=1; fi
          if ! grep -q -F 'viewModel.setNoKeycapMode' "$WS/$F6"; then echo "::error::主题设置页未接 ViewModel.setNoKeycapMode"; fail=1; fi
          # ThemeSettingsViewModel：状态与 setter
          if ! grep -q -F 'noKeycapMode' "$WS/$F7"; then echo "::error::ThemeUiState.noKeycapMode 丢失"; fail=1; fi
          if ! grep -q -F 'KeyboardThemes.setNoKeycapMode(context' "$WS/$F7"; then echo "::error::setNoKeycapMode 未写入全局状态"; fail=1; fi
          # xime.yaml：方案市场索引 base_urls 顶部应插入自建镜像（含 oh-my-rime），官方镜像保留作后备
          c5=$(grep -c -F 'cdn.jsdelivr.net/gh/lw-zg/Xime@xime-index/' "$WS/$F5" || true)
          if [ "$c5" != "1" ]; then echo "::error::$N5 里自建镜像索引出现 $c5 次，应为 1 次"; fail=1; fi
          if ! grep -q -F 'raw.githubusercontent.com/lw-zg/Xime/refs/heads/xime-index/' "$WS/$F5"; then echo "::error::$N5 里 raw 回退镜像丢失"; fail=1; fi
          if ! grep -q -F 'https://index.ximei.me/' "$WS/$F5"; then echo "::error::$N5 里官方索引 index.ximei.me 被删了（应保留作后备）"; fail=1; fi
          # ？↔％ 互换：qwerty/qwerty_en/qwerty_tablet/qwerty_en_tablet 四个键盘段的 v/n 上滑对调
          c6=$(grep -c -F 'swipe_up: { label: "％", value: "%" }' "$WS/$F5" || true)
          if [ "$c6" != "2" ]; then echo "::error::中文键盘 v 上滑『％』出现 $c6 次，应为 2 次（qwerty + qwerty_tablet）"; fail=1; fi
          c7=$(grep -c -F 'swipe_up: { label: "？", value: "?" }' "$WS/$F5" || true)
          if [ "$c7" != "2" ]; then echo "::error::中文键盘 n 上滑『？』出现 $c7 次，应为 2 次（qwerty + qwerty_tablet）"; fail=1; fi
          c8=$(grep -c -F 'swipe_up: "%"' "$WS/$F5" || true)
          if [ "$c8" != "2" ]; then echo "::error::英文键盘 v 上滑 % 出现 $c8 次，应为 2 次（qwerty_en + qwerty_en_tablet）"; fail=1; fi
          c9=$(grep -c -F 'swipe_up: "?"' "$WS/$F5" || true)
          if [ "$c9" != "4" ]; then echo "::error::swipe_up \"?\" 出现 $c9 次，应为 4 次（英文 n 键 2 处互换进来 + qwerty_17/18 原有 2 处）"; fail=1; fi
          # SwipeBubble.kt：按键气泡去掉（按压气泡 + 上滑/下滑提示气泡），只保留长按选择弹窗
          if ! grep -q -F 'if (!swipeState.isLongPress) return null' "$WS/$F8"; then echo "::error::按键气泡守卫丢失（非长按状态仍在画气泡）"; fail=1; fi
          if ! grep -q -F '本地补丁：去掉按键气泡' "$WS/$F8"; then echo "::error::气泡补丁标记丢失"; fail=1; fi
          if ! grep -q -F 'if (!swipeState.isSwiping && !swipeState.isPressed && !swipeState.isLongPress) return null' "$WS/$F8"; then echo "::error::SwipeBubble 原有早退守卫被改坏"; fail=1; fi
          if ! grep -q -F 'fun DrawScope.drawSwipeBubble' "$WS/$F8"; then echo "::error::drawSwipeBubble 绘制函数不见了"; fail=1; fi
          # SymbolKeyboardLayout.kt：全量符号浮层返回键从顶部导航区搬到左下角
          if grep -q -F '// 导航区：返回按钮' "$WS/$F9"; then echo "::error::符号浮层顶部导航区还在（返回键没搬走）"; fail=1; fi
          if ! grep -q -F '本地补丁：返回键挪到左下角' "$WS/$F9"; then echo "::error::符号浮层左下角返回键丢失"; fail=1; fi
          c10=$(grep -c -F 'contentDescription = "返回"' "$WS/$F9" || true)
          if [ "$c10" != "1" ]; then echo "::error::符号浮层返回键应只剩 1 处（搬移不是复制），实际 $c10 处"; fail=1; fi
          c11=$(grep -c -F 'onBack()' "$WS/$F9" || true)
          if [ "$c11" != "1" ]; then echo "::error::符号浮层 onBack() 调用应只剩 1 处，实际 $c11 处"; fail=1; fi
          if ! grep -q -F '// 底部：返回 + 分类 Tab + 删除按钮' "$WS/$F9"; then echo "::error::符号浮层底部行注释没更新"; fail=1; fi
          if [ "$fail" != "0" ]; then exit 1; fi
          echo "  ✓ 两处 38dp 阈值 + 去掉 18dp 兜底 + 键区内边距归零 + 底排外侧圆角 + 滑键改判（误触修复） + 无键帽全局开关（含按键边框）+ 主题设置页开关 + 内置方案市场镜像索引 + ？↔％ 互换 + 去掉按键气泡 + 符号浮层返回键挪左下角，全部到位"
          echo "── 相对上游的最终改动 ──"
          git --no-pager diff --stat

      - name: Kotlin 结构预检（括号配平 + 链式逗号位置）
        # 为什么需要这道闸门：git apply / git merge-file 只保证补丁「套得上」，
        # 不保证合并产物还是合法 Kotlin。run #17 就是合并干净、断言全过，但
        # KeyButton.kt 里 `.background(...) ,` 的逗号（它终止外层 Box 的 modifier
        # 参数）后面被插进了 `.then(...)` 修饰链 → 编译语法错误，白跑 13 分钟 Gradle。
        # 这里在搭 JDK/NDK/Rust 之前，用几秒钟的纯文本结构检查先拦一道。
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          F1="app/src/main/java/com/kingzcheung/xime/service/XimeInputMethodService.kt"
          F2="app/src/main/java/com/kingzcheung/xime/ui/keyboard/KeyboardLayout.kt"
          F3="app/src/main/java/com/kingzcheung/xime/ui/keyboard/KeyButton.kt"
          F4="app/src/main/java/com/kingzcheung/xime/ui/theme/KeyboardTheme.kt"
          F6="app/src/main/java/com/kingzcheung/xime/ui/settings/ThemeSettingsScreen.kt"
          F7="app/src/main/java/com/kingzcheung/xime/viewmodel/ThemeSettingsViewModel.kt"
          F8="app/src/main/java/com/kingzcheung/xime/ui/keyboard/SwipeBubble.kt"
          F9="app/src/main/java/com/kingzcheung/xime/ui/keyboard/SymbolKeyboardLayout.kt"
          python3 - "$F1" "$F2" "$F3" "$F4" "$F6" "$F7" "$F8" "$F9" <<'PYEOF'
          import sys

          def blank_noncode(text):
              """把注释与字符串/字符字面量替换成空格（保留换行，行号列号不变）。"""
              out = list(text)
              n = len(text)
              i = 0
              stack = []  # 'str' | 'raw' | 'chr' | ('tmpl', depth)

              def bl(k):
                  if text[k] != "\n":
                      out[k] = " "

              while i < n:
                  c = text[i]
                  top = stack[-1] if stack else None
                  if top is None:
                      if c == "/" and i + 1 < n and text[i + 1] == "/":
                          j = text.find("\n", i)
                          j = n if j == -1 else j
                          for k in range(i, j):
                              bl(k)
                          i = j
                          continue
                      if c == "/" and i + 1 < n and text[i + 1] == "*":
                          j = text.find("*/", i + 2)
                          j = n if j == -1 else j + 2
                          for k in range(i, j):
                              bl(k)
                          i = j
                          continue
                      if c == '"':
                          if text.startswith('"""', i):
                              for k in range(i, i + 3):
                                  bl(k)
                              stack.append("raw")
                              i += 3
                              continue
                          bl(i)
                          stack.append("str")
                          i += 1
                          continue
                      if c == "'":
                          bl(i)
                          stack.append("chr")
                          i += 1
                          continue
                      i += 1
                      continue
                  if top == "str":
                      if c == "\\":
                          bl(i)
                          if i + 1 < n:
                              bl(i + 1)
                          i += 2
                          continue
                      if c == '"':
                          bl(i)
                          stack.pop()
                          i += 1
                          continue
                      if c == "$" and i + 1 < n and text[i + 1] == "{":
                          bl(i)
                          bl(i + 1)
                          stack.append(("tmpl", 0))
                          i += 2
                          continue
                      bl(i)
                      i += 1
                      continue
                  if top == "raw":
                      if text.startswith('"""', i):
                          for k in range(i, i + 3):
                              bl(k)
                          stack.pop()
                          i += 3
                          continue
                      bl(i)
                      i += 1
                      continue
                  if top == "chr":
                      if c == "\\":
                          bl(i)
                          if i + 1 < n:
                              bl(i + 1)
                          i += 2
                          continue
                      if c == "'":
                          bl(i)
                          stack.pop()
                          i += 1
                          continue
                      bl(i)
                      i += 1
                      continue
                  # ('tmpl', depth)：字符串模板 ${...} 内部，允许嵌套字符串
                  if c == "{":
                      stack[-1] = ("tmpl", top[1] + 1)
                      bl(i)
                      i += 1
                      continue
                  if c == "}":
                      if top[1] == 0:
                          stack.pop()
                      else:
                          stack[-1] = ("tmpl", top[1] - 1)
                      bl(i)
                      i += 1
                      continue
                  if c == '"':
                      if text.startswith('"""', i):
                          for k in range(i, i + 3):
                              bl(k)
                          stack.append("raw")
                          i += 3
                          continue
                      bl(i)
                      stack.append("str")
                      i += 1
                      continue
                  if c == "'":
                      bl(i)
                      stack.append("chr")
                      i += 1
                      continue
                  bl(i)
                  i += 1
                  continue
              return "".join(out), bool(stack)

          def check_text(name, text):
              problems = []
              code, unclosed = blank_noncode(text)
              if unclosed:
                  problems.append("%s: 剥离注释/字符串后仍有未闭合的字符串或模板" % name)
              lines = code.split("\n")
              pairs = {")": "(", "]": "[", "}": "{"}
              st = []
              for ln, line in enumerate(lines, 1):
                  for ch in line:
                      if ch in "([{":
                          st.append((ch, ln))
                      elif ch in ")]}":
                          if not st:
                              problems.append("%s:%d 多余的右括号 %r" % (name, ln, ch))
                          elif st[-1][0] != pairs[ch]:
                              problems.append("%s:%d 括号不匹配：%r 开于第 %d 行" % (name, ln, st[-1][0], st[-1][1]))
                              st.pop()
                          else:
                              st.pop()
              for ch, ln in st:
                  problems.append("%s:%d 左括号 %r 没有闭合" % (name, ln, ch))
              prev = ""
              prev_ln = 0
              for ln, line in enumerate(lines, 1):
                  s = line.strip()
                  if s.startswith(".") and prev.endswith(","):
                      problems.append("%s:%d 以 `.` 开头的链式调用出现在以 `,` 结尾的行之后"
                                      "（第 %d 行的逗号已终止参数/表达式 → 语法错误）" % (name, ln, prev_ln))
                  if s:
                      prev = line.rstrip()
                      prev_ln = ln
              return problems

          bad = 0
          for p in sys.argv[1:]:
              with open(p, encoding="utf-8", newline="") as fh:
                  text = fh.read()
              probs = check_text(p, text)
              if probs:
                  bad = 1
                  for x in probs:
                      print("  x " + x)
              else:
                  print("  ok %s" % p)
          if bad:
              print("::error::Kotlin 结构预检未通过 —— 合并产物存在语法级问题，请先修补丁再构建")
              sys.exit(1)
          print("  ok Kotlin 结构预检全部通过（括号配平 + 链式逗号位置）")
          PYEOF

      - name: 自检 —— 三方合并对上游邻近改动的容忍度与失败可见性
        # 纯体检步骤，不阻塞真正的构建（真正的保护是上一步的合并与断言）。
        # 它演示两个方向：① 上游改到 hunk 上下文里「隔开几行」的一条 —— 逐行 apply 已套不上，
        # 但三方合并能干净绕开；② 上游改的正是「紧贴」我们改动的那条 —— 三方合并明确报冲突。
        if: github.event.inputs.force == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          REF="$RUNNER_TEMP/ref"
          BASE="$REF/patch-base"
          PATCH="$REF/xime-flush-bottom.patch"
          F1="app/src/main/java/com/kingzcheung/xime/service/XimeInputMethodService.kt"
          F2="app/src/main/java/com/kingzcheung/xime/ui/keyboard/KeyboardLayout.kt"
          F3="app/src/main/java/com/kingzcheung/xime/ui/keyboard/KeyButton.kt"
          F4="app/src/main/java/com/kingzcheung/xime/ui/theme/KeyboardTheme.kt"
          N1="XimeInputMethodService.kt"
          N2="KeyboardLayout.kt"
          N3="KeyButton.kt"
          N4="KeyboardTheme.kt"
          # 补丁 hunk 里的两条上下文行（本补丁并不修改它们）：
          TOL="// 标准（三键）导航栏 inset 明显大于手势条，额外多减一点，"   # 距改动 3 行
          ADJ="val extraShrinkDp = if (rawDp >= 120) 8 else 0"                # 紧贴改动

          perturb () {   # 把 base 文件里第一条含 $1 的行末尾加段注释，模拟「上游改了这行」
            rm -rf "$RUNNER_TEMP/pert"
            mkdir -p "$RUNNER_TEMP/pert/$(dirname "$F1")" "$RUNNER_TEMP/pert/$(dirname "$F2")" \
                     "$RUNNER_TEMP/pert/$(dirname "$F3")" "$RUNNER_TEMP/pert/$(dirname "$F4")"
            awk -v t="$1" 'n==0 && index($0,t){print $0 "  // upstream-touched"; n=1; next} {print}' \
              "$BASE/$N1" > "$RUNNER_TEMP/pert/$F1"
            cp "$BASE/$N2" "$RUNNER_TEMP/pert/$F2"
            cp "$BASE/$N3" "$RUNNER_TEMP/pert/$F3"
            cp "$BASE/$N4" "$RUNNER_TEMP/pert/$F4"
            ( cd "$RUNNER_TEMP/pert" && git init -q . )
          }

          case_run () {  # $1=场景名  $2=扰动目标行  $3=期望的 merge 结果(clean|conflict)
            perturb "$2"
            if ( cd "$RUNNER_TEMP/pert" && git apply --check "$PATCH" ) >/dev/null 2>&1; then
              echo "::warning::[$1] 旧做法 git apply --check 竟然还能套上（扰动没落进上下文窗口）"
            else
              echo "  [$1] 旧做法（逐行 git apply）-> 失败（符合预期：逐行匹配很脆）"
            fi
            if git merge-file -p "$RUNNER_TEMP/pert/$F1" "$BASE/$N1" "$RUNNER_TEMP/post-$N1" \
                 > "$RUNNER_TEMP/st-$1.kt" 2>"$RUNNER_TEMP/err-$1.txt"; then got=clean; else got=conflict; fi
            if [ "$got" = "$3" ]; then
              echo "  [$1] 新做法（三方合并）-> $got（符合预期）"
            else
              echo "::warning::[$1] 新做法（三方合并）-> $got，与预期 $3 不符"
            fi
          }

          echo "① 上游改了 hunk 上下文里「隔开几行」的一条 ——"
          case_run tol "$TOL" clean
          echo "② 上游改的正是「紧贴」我们改动的那一条 ——"
          case_run adj "$ADJ" conflict
          echo "结论：三方合并能容忍『邻近但不重叠』的上游改动（这些改动逐行 apply 已经套不上）；"
          echo "      一旦真的与我们改动的那几行重叠，它会明确报冲突，而不是静默出错。"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            gradle/libs.versions.toml
            **/*.gradle*
            **/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK and SDK platform
        run: |
          sdkmanager "ndk;29.0.14206865" "platforms;android-37.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache native deps
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs/**/libonnxruntime.so
            app/build/onnxruntime-android-*.aar
            app/build/onnxruntime-aar
          key: native-${{ runner.os }}-${{ hashFiles('app/build-logic/tasks-native.gradle.kts') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Download native deps (ONNX Runtime)
        # 该任务自带「4 个 ABI 的 .so + 头文件齐备即跳过」的守卫，且 AAR 已存在时也会跳过下载；
        # 但只要真的需要联网，它就会按镜像逐个重试，而单个连接的读超时是 10 分钟
        # → 网络不佳时这一步能挂住半小时以上（run #19 即卡死在此 30+ 分钟，最后只能取消）。
        # 故：① 去掉 --refresh-dependencies（不强制联网复核依赖元数据，让它安心用缓存）；
        #     ② 上面额外缓存已下好的 AAR，缓存命中时连解压都走本地、完全不碰网络；
        #     ③ 套一层 timeout 兜底：真下不动就快速失败，而不是无限期占着 runner。
        run: |
          timeout 900 ./gradlew downloadOnnx --no-daemon || {
            echo "::error::下载 ONNX Runtime 失败或超过 15 分钟超时 —— 检查 runner 到 Maven Central / 镜像源的连通性。"
            exit 1
          }

      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
            app/src/main/jni/boost
            app/src/main/jni/boost-*.tar.xz
          key: cmake-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Rust (xime-plugin CLI)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/xime-plugin/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/xime-plugin/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build Plugins (TS -> JS)
        run: |
          cd tools/xime-plugin
          cargo run --quiet -- build --all --plugins-dir ../../plugins --out ../../build/plugin-js
          cargo run --quiet -- build test-fixture --out ../../build/plugin-js

      - name: 写入签名配置（release 必需；只在 runner 上落地，不提交）
        if: needs.check.outputs.variant == 'release'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          [ -n "${SIGNING_KEY:-}" ] || { echo "::error::仓库缺少 SIGNING_KEY secret，release 无法签名"; exit 1; }
          [ -n "${KEY_STORE_PASSWORD:-}" ] || { echo "::error::仓库缺少 KEY_STORE_PASSWORD secret"; exit 1; }
          [ -n "${KEY_ALIAS:-}" ] || { echo "::error::仓库缺少 ALIAS secret"; exit 1; }
          [ -n "${KEY_PASSWORD:-}" ] || { echo "::error::仓库缺少 KEY_PASSWORD secret"; exit 1; }
          cat > app/keystore.properties <<EOF
          keyBase64=${SIGNING_KEY}
          storePassword=${KEY_STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          echo "已写入 app/keystore.properties（$(( $(wc -c < app/keystore.properties) )) 字节，不入库）"
          git status --porcelain app/keystore.properties || true

      - name: ABI 收窄 init 脚本（CI 只编 ${{ env.TARGET_ABI }}，跳过其余 3 个 ABI 的 native 编译）
        # 上游 defaultConfig.ndk.abiFilters 与 splits.abi 都列了 4 个 ABI，
        # 而本工作流只发布 arm64-v8a → 另外 3 个 ABI 的 CMake 编译（每个约 3 分钟）纯属浪费。
        # 用 --init-script 从外部收窄，**不改上游任何文件**（与版本号用 -P 回灌同一思路，避免补丁漂移）。
        # 脚本内部全程 try/catch：万一 AGP 版本差异导致改写失败，也只打印告警、不影响构建；
        # 产物选取步骤仍只取 ${{ env.TARGET_ABI }}，最坏情况 = 没省下时间，而非构建失败。
        run: |
          cat > "$RUNNER_TEMP/restrict-abi.init.gradle" <<'GRADLEEOF'
          // CI 专用：把 ABI 收窄到 TARGET_ABI（默认 arm64-v8a）。
          // 在 afterEvaluate 里改；init 脚本的 allprojects 注册早于构建脚本体，
          // 因此本回调先于 AGP 自己的 afterEvaluate 执行 —— 后者才据此创建 CMake 任务。
          final String ABITARGET = System.getenv('TARGET_ABI') ?: 'arm64-v8a'
          allprojects { proj ->
              proj.afterEvaluate {
                  try {
                      def ext = proj.extensions.findByName('android')
                      if (ext == null) return
                      def dc = ext.defaultConfig
                      if (dc != null && dc.ndk != null) {
                          def before = new ArrayList(dc.ndk.abiFilters)
                          dc.ndk.abiFilters.clear()
                          dc.ndk.abiFilters.add(ABITARGET)
                          println "[ci-restrict-abi] ${proj.name} ndk.abiFilters ${before} -> ${dc.ndk.abiFilters}"
                      }
                      try {
                          if (ext.splits != null && ext.splits.abi != null) {
                              ext.splits.abi.reset()
                              ext.splits.abi.include(ABITARGET)
                              ext.splits.abi.universalApk = false
                              println "[ci-restrict-abi] ${proj.name} splits.abi -> ${ABITARGET}"
                          }
                      } catch (Throwable t) {
                          println "[ci-restrict-abi] splits.abi 改写跳过: ${t}"
                      }
                  } catch (Throwable t) {
                      println "[ci-restrict-abi] 收窄失败（忽略，构建照常进行）: ${t}"
                  }
              }
          }
          GRADLEEOF
          echo "── restrict-abi.init.gradle（$(wc -l < "$RUNNER_TEMP/restrict-abi.init.gradle") 行）──"
          cat "$RUNNER_TEMP/restrict-abi.init.gradle"

      - name: Build APK
        env:
          # 从上游 release 源码读到的版本号；显式回灌，确保产物版本与上游一致
          VER: ${{ needs.check.outputs.version }}
          VCODE: ${{ needs.check.outputs.version_code }}
        run: |
          set -e
          VER_ARGS=""
          if [ -n "$VER" ]; then VER_ARGS="$VER_ARGS -PversionName=$VER"; fi
          if [ -n "$VCODE" ]; then VER_ARGS="$VER_ARGS -PversionCode=$VCODE"; fi
          echo "版本参数:${VER_ARGS:-<无>}"
          ABI_ARGS="--init-script $RUNNER_TEMP/restrict-abi.init.gradle"
          if [ "${{ needs.check.outputs.variant }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon $ABI_ARGS $VER_ARGS
          else
            ./gradlew assembleDebug --no-daemon $ABI_ARGS $VER_ARGS
          fi

      - name: 校验 release 签名
        if: needs.check.outputs.variant == 'release'
        run: |
          set -e
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" >/dev/null
            echo "已验签: $apk"
          done

      - name: 选定 APK 并核对内含架构
        id: pick
        run: |
          set -euo pipefail
          DIR="app/build/outputs/apk/${{ needs.check.outputs.variant }}"
          echo "产物目录："
          ls -l "$DIR"
          APK=$(find "$DIR" -name "*-${TARGET_ABI}.apk" | head -1)
          STRICT=1
          if [ -z "$APK" ]; then
            echo "::warning::没找到 ${TARGET_ABI} 专属包，退回 universal"
            APK=$(find "$DIR" -name '*universal.apk' | head -1)
            STRICT=0
          fi
          [ -n "$APK" ] || { echo "::error::目录里没有 APK"; exit 1; }
          echo "选中: $APK"
          echo "内含 native 架构："
          unzip -l "$APK" | grep -o 'lib/[^/]*/' | sort -u
          if [ "$STRICT" = "1" ]; then
            BAD=$(unzip -l "$APK" | grep -o 'lib/[^/]*/' | sed 's#lib/##; s#/##' | sort -u | grep -v -x "$TARGET_ABI" || true)
            if [ -n "$BAD" ]; then
              echo "::error::选中的 APK 里含非目标架构（$(echo "$BAD" | tr '\n' ' ')），应只有 $TARGET_ABI —— 选取逻辑出错了"
              exit 1
            fi
            echo "  ✓ 只含 $TARGET_ABI"
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: 核对 APK 版本号已同步上游 release
        env:
          EXPECT: ${{ needs.check.outputs.version }}
        run: |
          set -e
          APK="${{ steps.pick.outputs.apk }}"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | tail -1 || true)
          if [ -z "$AAPT" ] || [ -z "$EXPECT" ]; then
            echo "::warning::缺少 aapt 或期望版本号，跳过版本号核对"
            exit 0
          fi
          GOT=$("$AAPT" dump badging "$APK" | grep -m1 -oE "versionName='[^']*'" | sed -E "s/versionName='([^']*)'/\1/")
          echo "APK versionName = $GOT ；上游 release 版本 = $EXPECT"
          if [ "$GOT" != "$EXPECT" ]; then
            echo "::error::APK 版本号与上游 release 不一致（$GOT != $EXPECT）—— 版本同步失效"
            exit 1
          fi

      - name: 收集失败现场（仅失败时；基准文件在 $RUNNER_TEMP，要先拷回工作区）
        if: failure()
        run: |
          mkdir -p patch-base
          cp -f "$RUNNER_TEMP/ref/patch-base/"* patch-base/ 2>/dev/null || true
          cp -f "$RUNNER_TEMP/ref/xime-flush-bottom.patch" . 2>/dev/null || true
          ls -l patch-base 2>/dev/null || true
          ls -l CONFLICT-*.kt 2>/dev/null || true

      - name: 上传冲突文件（仅在失败时可复盘）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: patch-conflict-dump
          path: |
            CONFLICT-*.kt
            patch-base/**
            xime-flush-bottom.patch
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: patched-${{ needs.check.outputs.variant }}-apk
          path: app/build/outputs/apk/${{ needs.check.outputs.variant }}/*.apk
          retention-days: 30

      - name: 发布到 Release（固定标签，永久链接）
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VARIANT: ${{ needs.check.outputs.variant }}
          TAG: ${{ needs.check.outputs.tag }}
          UP_REL: ${{ needs.check.outputs.rel }}
          UP_REF: ${{ needs.check.outputs.ref }}
          UP_VER: ${{ needs.check.outputs.version }}
          UP_VC: ${{ needs.check.outputs.version_code }}
          UP_MODE: ${{ needs.check.outputs.mode }}
        run: |
          set -e
          APK="${{ steps.pick.outputs.apk }}"
          # 版本号可能带空格/斜杠等，先净化成文件名安全的形态
          VER_SAFE=$(printf '%s' "${UP_VER:-unknown}" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          [ -n "$VER_SAFE" ] || VER_SAFE=unknown
          OUT="xime-patched-${VARIANT}-${VER_SAFE}-${TARGET_ABI}.apk"   # 带版本号，一看就知道是哪一版
          ALIAS="xime-patched-${VARIANT}-${TARGET_ABI}.apk"             # 稳定别名：永久链接始终指向最新版
          cp "$APK" "$OUT"
          cp "$APK" "$ALIAS"
          UP=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          SHA256=$(sha256sum "$OUT" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$OUT")
          if [ "$VARIANT" = "release" ]; then
            TITLE="Xime 贴底补丁版 · ${UP_VER:-$SHORT}（arm64，自动跟随上游 release）"
            KIND="release（R8 精简 + 资源压缩）"
            SIGN="固定密钥签名（密钥存在本仓库 Secrets 里）—— 以后**可直接覆盖安装升级，不会丢 Rime 数据**"
          else
            TITLE="Xime 贴底补丁版 · debug（arm64，自动跟随上游 release）"
            KIND="debug"
            SIGN="调试密钥（每次构建可能不同）—— 更新前需要先卸载"
          fi
          NOTES=$(printf '跟随上游 ximeiorg/Xime 自动构建的「键盘底部贴底」补丁版。\n\n<!-- upstream-release: %s -->\n<!-- upstream-ref: %s -->\n<!-- upstream-sha: %s -->\n\n- 触发 release: `%s`\n- 上游版本: `%s`（versionCode %s，%s 轨道）\n- 上游源码引用: `%s`（有新 commit 即随 main 拉取）\n- 上游 commit: `%s`\n- 构建类型: %s\n- 目标架构: 仅 `%s`（现代手机适用；其他架构请改工作流的 TARGET_ABI）\n- 补丁: 手势导航下键区贴到屏幕底边（inset ≤ 38dp 不留白；三键导航仍避让）\n- 误触修复: 拇指指腹先触发的行不再抢先输出——松手时按手指最终落点改判按键；上滑/长按/光标手势不受影响\n- 无键帽模式: 主题设置里新增总开关，**对所有主题生效**；开启后键面不显示底色（透明），改画 1dp 按键边框标示键位，按下/高亮时给出提示；关闭后各主题观感不变\n- 键位调整: qwerty / qwerty_en / qwerty_tablet / qwerty_en_tablet 四个键盘段的 **v 键上滑与 n 键上滑对调（？ ↔ ％）**\n- 按键气泡: 按压气泡与上滑/下滑提示气泡已**去掉**（主键盘/面板/T9/笔画通用）；长按选择弹窗保留——它承担滑动挑选变体的视觉反馈，去掉会长按选字变成盲选\n- 符号页返回键: 全量符号浮层的返回键从**左上角**挪到**左下角**（底部行行首，圆形 ← 外观与行为不变），单手拇指更够得着；分类 Tab 与删除键位置不变\n- 内置方案市场: `assets/xime.yaml` 的 `base_urls` 顶部加入自建镜像（含 **oh-my-rime 薄荷拼音**等额外方案，可在「输入方案」里一键下载安装）；官方镜像保留作后备\n- 融合方式: 三方合并（自动适配上游改动），冲突时构建会失败并给出冲突片段\n- 包名: com.kingzcheung.xime —— 与官方同包名，首次安装前必须先卸载官方版\n- 签名: %s\n- sha256: `%s`\n- 大小: %s 字节\n- 资产: %s（带版本号）/ %s（稳定别名，永久链接不变）\n- 构建记录: https://github.com/%s/actions\n' "$UP_REL" "$UP_REF" "$UP" "$UP_REL" "$UP_VER" "${UP_VC:-?}" "$UP_MODE" "$UP_REF" "$SHORT" "$KIND" "$TARGET_ABI" "$SIGN" "$SHA256" "$SIZE" "$OUT" "$ALIAS" "$GITHUB_REPOSITORY")
          # 正式版 Release（不是 prerelease）——这样 GitHub 主页右侧的 Releases 栏
          # 与 releases/latest 都会指向这个「可下载的最新编译版」，而不是被每日自动
          # 更新的方案包 prerelease 抢走（方案包刻意保持 prerelease，不参与 latest 计算）。
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease=false --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --latest
          fi
          # gh release edit 只改 notes、**不改标题**（标题只在 create 时设）→ 显式 PATCH 一次，
          # 否则历史 release 的标题会一直停留在旧版本号上。
          REL_ID=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$REL_ID" -f name="$TITLE" >/dev/null
          echo "标题已更新为: $TITLE"
          # 两个名字一起上传：版本号版便于识别，别名版保证既有的永久下载链接继续可用
          gh release upload "$TAG" "$OUT" "$ALIAS" --repo "$GITHUB_REPOSITORY" --clobber
          echo "已发布: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$OUT"
          echo "稳定别名: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ALIAS"
          {
            echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ALIAS"
            echo "url_v=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$OUT"
            echo "sha=$SHORT"
            echo "sha256=$SHA256"
            echo "size=$SIZE"
            echo "variant=$VARIANT"
            echo "tag=$TAG"
            echo "rel=$UP_REL"
            echo "ref=$UP_REF"
            echo "version=$UP_VER"
          } >> "$GITHUB_OUTPUT"

  notify:
    needs: build
    runs-on: ubuntu-latest
    env:
      # GitHub 的 steps[*].if 不允许引用 secrets 上下文；先把 secret 提升成 env 才能在 if 里判断。
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - name: 发送邮件通知（未配置 MAIL_TO 时自动跳过，且永不影响构建结果）
        if: env.MAIL_TO != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SMTP_SERVER }}
          server_port: ${{ secrets.MAIL_SMTP_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Xime 贴底补丁版新 APK 已构建（${{ needs.build.outputs.version }} · ${{ needs.build.outputs.sha }}）"
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          body: |
            Xime「键盘底部贴底」补丁版 APK 已自动跟随上游正式 release 重新构建、发布。

            上游 release: ${{ needs.build.outputs.rel }}
            上游版本    : ${{ needs.build.outputs.version }}
            上游引用    : ${{ needs.build.outputs.ref }}
            上游 commit : ${{ needs.build.outputs.sha }}
            构建类型    : ${{ needs.build.outputs.variant }}
            目标架构    : 仅 arm64-v8a
            sha256     : ${{ needs.build.outputs.sha256 }}
            大小        : ${{ needs.build.outputs.size }} 字节

            永久下载链接（固定，覆盖安装即可升级，不丢 Rime 数据）:
            ${{ needs.build.outputs.url }}

            带版本号的下载链接:
            ${{ needs.build.outputs.url_v }}

            —— 由 fork lw-zg/Xime 的 build-patched.yml 自动发出
